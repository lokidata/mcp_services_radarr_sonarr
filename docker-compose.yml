services:
  radarr-sonarr-mcp:
    build: .
    image: radarr-sonarr-mcp
    restart: unless-stopped
    ports:
      # Bound to localhost only; the server has no authentication of its own
      - "127.0.0.1:${MCP_SERVER_PORT:-3000}:3000"
    env_file: .env
    environment:
      # The container always listens on 3000; MCP_SERVER_PORT in .env only changes the published host port
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: "3000"
