[project]
name = "radarr-sonarr-mcp"
version = "0.1.1"
description = "MCP Server for Radarr and Sonarr media management"
authors = [
  { name = "Berry", email = "berry@berry.com" }
]
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "fastmcp>=4.1.0",
  "requests>=2.28.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=3.0.0"]

[project.scripts]
radarr-sonarr-mcp = "radarr_sonarr_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["radarr_sonarr_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
